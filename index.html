<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CRUX — Bouldering Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">

        <header></header>

        <main>
            <!-- 1. AUTH / INLOGGNING (Only showed when the user is NOT logged in) -->
            <section v-if="!isLoggedIn" id="auth-section" class="user-grid">
                <h2>{{ isRegister ? 'Create Account' : 'Log In'}}</h2>
                <div class="user-container">
                    <form @submit.prevent="handleAuth" class="climb-form">

                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" v-model="authForm.username" placeholder="Username" required class="form-input">
                        </div>

                        <div v-if="isRegister" class="form-group">
                            <label>Email</label>
                            <input type="text" v-model="authForm.email" placeholder="you@example.com" required class="form-input">
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" v-model="authForm.password" placeholder="••••••••" required class="form-input">
                        </div>

                        <p v-if="authError" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem;">
                            {{ authError }}
                        </p>

                        <div class="form-actions" style="margin-top: 1rem">
                            <button type="submit" class="btn-submit" style="width: 100%;">
                                {{ isRegister ? 'Register' : 'Log In'}}
                            </button>
                        </div>
                        <div style="margin-top: 1rem; text-align: center;">
                            <p style="margin-bottom: 0.5rem; color: #e0e0e0;">Not feeling fully committed yet?</p>
                            <button type="button" class="btn-submit" @click="loginAsGuest">
                                Demo Mode
                            </button>
                            <p style="font-size: 0.8rem; color: #888; margin-top: 0.5rem;">
                                Explore locally without an account or backend server.
                            </p>
                        </div>
                    </form>

                
                    <div style="margin-top: 1rem; text-align: center;">
                        <button type="button" @click="toggleAuthMode" class="btn-reset" style="background: transparent; border: none; cursor: pointer;">
                            {{ isRegister ? 'Already have an account? Log In' : "Don't have an account? Register"}}
                        </button>
                    </div>
                   
                </div>

            </section>
            <template v-else>
                <!-- Hero section-->
            <section id="hero" class="hero-container">
                <h1>
                    <span class="brand-badge">[CRUX]</span><br>
                    LOG YOUR SENDS. <br>
                    TRACK YOUR PROJECTS.
                </h1>
                <p class="tagline">
                    Data-driven climbing.<br>
                    Because <em>"I almost had it"</em> doesn't count on the log.
                </p>

                <button v-if="isLoggedIn" @click="logout" class="btn-logout">
                    Log Out 
                </button>
             
                <div class="stats-container">
                    <div class="stats-card">
                        <span class="stat-number">{{ totalFlashes }}</span>
                        <span class="stat-label">TOTAL FLASHES</span>

                    </div>
                    <div class="stats-card">
                        <span class="stat-number">{{ totalSends }}</span>
                        <span class="stat-label">TOTAL SENDS</span>

                    </div>
                    <div class="stats-card">
                        <span class="stat-number">{{ activeProjects }}</span>
                        <span class="stat-label">ACTIVE PROJECTS</span>

                    </div>
                </div>
            </section>

            <!-- Filter section-->
            <section id="filters" class="filter-grid">
                <div class="filter-container">

                    <div class="filter-group">
                        <div class="filter-item">
                            <label class="filter-label">Status</label>
                            <select v-model="selectedStatus" class="filter-select">
                                <option value="">All</option>
                                <option value="FLASH">Flashes</option>
                                <option value="PROJECT">Projects</option>
                                <option value="RESET">Resets</option>
                                <option value="SEND">Sends</option>
                            </select>
                        </div>

                        <div class="filter-item">
                            <label class="filter-label">Grade</label>
                            <select v-model="selectedGrade" class="filter-select">
                                <option value="">All</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6A">6A</option>
                                <option value="6B">6B</option>
                                <option value="6C">6C</option>
                                <option value="7A">7A</option>
                                <option value="7B">7B</option>
                                <option value="7C">7C</option>
                                <option value="8A">8A</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="filter-label">Style</label>
                            <select v-model="selectedStyle" class="filter-select">
                                <option value="">All</option>
                                <option value="DYNO">Dyno</option>
                                <option value="OVERHANG">Overhang</option>
                                <option value="ROOF">Roof</option>
                                <option value="SLAB">Slab</option>
                                <option value="VERTICAL">Vertical</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label class="filter-label">&nbsp;</label>
                            <button v-if="hasActiveFilters" @click="resetFilters" class="btn-reset">
                                Clear filters
                            </button>
                        </div>


                    </div>
                </div>
            </section>

            <div class="dashboard-grid">
                <!-- Problem Display section -->
                <section id="problem-list" class="problem-grid">

                    <h2>Logged problems</h2>
                    <div class="problem-container">

                        <!-- Empty state om inga problem loggats-->
                        <div v-if="problems.length === 0" class="empty-state">
                            <p>You have no climbs logged yet.</p>
                        </div>

                        <!-- Om filtren ger 0 resultat-->
                        <div v-else-if="filteredProblems.length === 0" class="empty-state">
                            <p>No climbs found for your filters.</p>
                            <button @click="resetFilters" class="btn-reset" style="margin-top: 0.75rem;">
                                Clear filters
                            </button>
                        </div>

                        <!-- Problem finns och matchar filtren -->
                        <div v-else class="problem-cards-list">
                            <div v-for="problem in filteredProblems" :key="problem.id" class="problem-card"
                                @click="editProblem(problem)">

                                <div class="card-header">
                                    <div class="card-tags">
                                        <span class="badge badge-grade">{{ problem.grade }}</span>
                                        <!-- Dynamisk klass baserad på status -->
                                        <span class="badge" :class="getDisplayStatus(problem).toLowerCase()">
                                            {{ getDisplayStatus(problem) }}
                                        </span>
                                        <span class="badge badge-style">{{ problem.style }}</span>
                                    </div>
                                    <button @click.stop="deleteProblem(problem.id)" class="btn-delete"
                                        title="Delete problem">&times;</button>
                                </div>

                                <div class="card-body">
                                    <h3 class="gym-title">{{ problem.gym }} - {{ problem.date }}</h3>
                                    <p class="meta-info">
                                        <span>{{ problem.tries }} {{ problem.tries === 1 ? 'try' : 'tries' }}</span>
                                        <template v-if="problem.notes">
                                            <span class="meta-bullet">&bull;</span>
                                            <span class="problem-notes">"{{ problem.notes }}"</span>
                                        </template>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Problem Form section-->
                <section id="log-form" ref="formSection" class="log-grid">

                    <h2>{{ editingId ? 'Edit problem' : 'Add new problem' }}</h2>
                    <div class="form-container">
                        <form @submit.prevent="saveProblem" class="climb-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Gym</label>
                                    <input type="text" v-model="newProblem.gym" placeholder="e.g. Backa Boulder"
                                        required class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>Date</label>
                                    <input type="date" v-model="newProblem.date" required class="form-input">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Grade</label>
                                    <select v-model="newProblem.grade" required class="form-select">
                                        <option value="" disabled>Select grade</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6A">6A</option>
                                        <option value="6B">6B</option>
                                        <option value="6C">6C</option>
                                        <option value="7A">7A</option>
                                        <option value="7B">7B</option>
                                        <option value="7C">7C</option>
                                        <option value="8A">8A</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Attempts</label>
                                    <input type="number" v-model.number="newProblem.tries" min="1" class="form-input">
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label>Style</label>
                                <div class="chip-group">
                                    <button type="button"
                                        v-for="style in ['Dyno', 'Overhang', 'Roof', 'Slab', 'Vertical']" :key="style"
                                        class="chip-btn" :class="{ active: newProblem.style === style }"
                                        @click="newProblem.style = style">
                                        {{ style }}
                                    </button>
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label>Status</label>
                                <div class="chip-group">
                                    <button type="button" v-for="status in ['Send', 'Project']" :key="status"
                                        class="chip-btn" :class="{ active: newProblem.status === status }"
                                        @click="newProblem.status = status">
                                        {{ status }}
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Notes (optional)</label>
                                <input type="text" v-model="newProblem.notes" placeholder="e.g. Heel hook was key!"
                                    class="form-input">
                            </div>

                            <div class="form-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">

                                <button type="submit" class="btn-submit" style="flex: 1;">
                                    {{ editingId ? 'Update Problem' : 'Log Problem' }}
                                </button>

                                <template v-if="editingId">
                                    <button type="button" @click="markAsReset" class="btn-reset">
                                        Mark as Reset
                                    </button>
                                    <button type="button" @click="resetForm" class="btn-reset">
                                        Cancel
                                    </button>
                                </template> 
                            </div>

                        </form>
                    </div>
                </section>
            </div>


            <section id="user-profile" class="user-grid">

               
                <h2>{{ !isEditingProfile ? 'Your profile' : 'Edit Profile'}}</h2>
                <div class="user-container">
        
                    <!-- 1. DISPLAY VIEW (isEditingProfile = false) -->
                    <div v-if="!isEditingProfile" class="profile-card">
                        <div class="profile-details">
                            <div class="profile-item">
                                <span class="label">Username</span>
                                <strong>{{ user.name || 'Demo Climber' }}</strong>
                            </div>

                            <div class="profile-item">
                                <span class="label">Favorite Style</span>
                                <strong>{{ user.favoriteStyle || 'Not set' }}</strong>
                            </div>
                            <div class="profile-item">
                                <span class="label">Unfinished Business (Resets)</span>
                                <strong>{{ totalResets }}x</strong>

                            </div>

                            <div class="profile-item">
                                <span class="label">Storage Mode</span>
                                <span class="value" :style="{ color: user.saveData ? '#10b981' : '#f59e0b' }">
                                    {{ user.saveData ? '✓ Local Storage' : '⚠ Session Only' }}
                                </span>
                            </div>
                        </div>

                        <!-- 1. EDIT VIEW (isEditingProfile = true) -->
                        <div class="form-actions" style="margin-top: 1.25rem;">
                            <button type="button" @click="isEditingProfile = true" class="btn-submit"
                                style="width: 100%;">
                                Edit Profile
                            </button>
                        </div>
                    </div>

                    <form v-else @submit.prevent="updateProfile" class="climb-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" v-model="user.name" placeholder="..." class="form-input">
                            </div>

                            <div class="form-group">
                                <label>Favorite Style</label>
                                <select v-model="user.favoriteStyle" class="form-select">
                                    <option value="">None selected</option>
                                    <option value="Dyno">Dyno</option>
                                    <option value="Overhang">Overhang</option>
                                    <option value="Roof">Roof</option>
                                    <option value="Slab">Slab</option>
                                    <option value="Vertical">Vertical</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Data Storage Settings</label>
                            <div class="toggle-control" style="margin-top: 0.4rem;">
                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                    <input type="checkbox" v-model="user.saveData" @change="handleStorage">
                                    <span style="font-size: 0.85rem;">Save climbing data locally (localStorage)</span>
                                </label>
                            </div>

                            <p v-if="user.saveData" style="font-size: 0.75rem; color: #10b981; margin-top: 0.4rem;">
                                ✓ Data is saved in your browser's local storage.
                            </p>
                            <p v-else style="font-size: 0.75rem; color: #f59e0b; margin-top: 0.4rem;">
                                ⚠ Data is only kept in memory for this session.
                            </p>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit" style="flex: 1;">
                                Save Changes
                            </button>
                            <button type="button" @click="isEditingProfile = false" class="btn-reset">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </template>
    </main>

        <footer>
            <p>&copy; 2026 CRUX. All rights reserved.</p>
        </footer>

    </div>

    <script src="app.js"></script>
</body>

</html>
